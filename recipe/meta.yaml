{% set version = "0.4.1" %}

package:
  name: jdeskew
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/j/jdeskew/jdeskew-{{ version }}.tar.gz
  sha256: f578c182d5a6b5b49687340402a5e9399f3e62dfb4945ad76cb1d2cc51e35714

build:
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  number: 0

requirements:
  host:
    - python {{ python_min }}
    - setuptools >=42
    - setuptools-scm
    - wheel
    - pip
  run:
    - python >={{ python_min }}
    - numpy
    - opencv

test:
  imports:
    - jdeskew
  commands:
    - pip check
  requires:
    - pip
    - python {{ python_min }}

about:
  home: https://pypi.org/project/jdeskew/
  summary: Document Image Skew Estimation using Adaptive Radial Projection
  license: MIT
  license_file: LICENSE

extra:
  recipe-maintainers:
    - bgruening
    - danielopitz
