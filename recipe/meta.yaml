{% set version = "0.4.2" %}

package:
  name: jdeskew
  version: {{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/j/jdeskew/jdeskew-{{ version }}.tar.gz
  sha256: 27b18400172b6b81d700304aa67b67256f2433b7714dd0d48173ed39d9a585cd

build:
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  number: 0

requirements:
  host:
    - python {{ python_min }}
    - setuptools >=42
    - setuptools-scm
    - wheel
    - pip
  run:
    - python >={{ python_min }}
    - numpy
    - opencv

test:
  imports:
    - jdeskew
  commands:
    - pip check
  requires:
    - pip
    - python {{ python_min }}

about:
  home: https://pypi.org/project/jdeskew/
  summary: Document Image Skew Estimation using Adaptive Radial Projection
  license: MIT
  license_file: LICENSE

extra:
  recipe-maintainers:
    - bgruening
    - danielopitz
